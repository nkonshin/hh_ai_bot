[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hh-mcp-server"
version = "0.1.0"
description = "MCP server for hh.ru job search API"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
]

[project.scripts]
hh-mcp-server = "hh_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hh_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
